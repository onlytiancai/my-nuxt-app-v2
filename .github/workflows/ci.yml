name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client and run migrations
        run: |
          pnpm postinstall
          npx prisma migrate deploy
        env:
          DATABASE_URL: file:./test.db

      - name: Seed database for tests
        run: npx prisma db seed
        env:
          DATABASE_URL: file:./test.db

      - name: Run type check
        run: npx nuxt typecheck

      - name: Run unit tests
        run: pnpm test:unit --run
        env:
          DATABASE_URL: file:./test.db
          NUXT_SESSION_PASSWORD: test-session-password-at-least-32-chars

      - name: Run Nuxt runtime tests
        run: pnpm test:nuxt --run
        env:
          DATABASE_URL: file:./test.db
          NUXT_SESSION_PASSWORD: test-session-password-at-least-32-chars

      - name: Run E2E API tests
        run: pnpm test:e2e --run
        env:
          DATABASE_URL: file:./test.db
          NUXT_SESSION_PASSWORD: test-session-password-at-least-32-chars

      - name: Run E2E browser tests (Playwright)
        run: pnpm vitest --config vitest.config.ts --project e2e-browser --run
        env:
          DATABASE_URL: file:./test.db
          NUXT_SESSION_PASSWORD: test-session-password-at-least-32-chars

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
